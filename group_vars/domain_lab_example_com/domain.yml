---
ad_realm: LAB.EXAMPLE.COM
ad_domain_name: lab.example.com

ad_join_user: svc-linux-join
ad_join_password: "{{ vault_ad_join_password }}"

ad_computer_ou: "OU=Linux Servers,OU=Servers,DC=lab,DC=example,DC=com"

ad_krb5_default_realm: LAB.EXAMPLE.COM

ad_test_user: "test.linux@lab.example.com"
ad_test_group: "INF_READ@lab.example.com"

ad_sudo_permissions:
  - name: INF_ADMIN
    ad_group: "INF_ADMIN@lab.example.com"
    sudoers_file: "10-ad-inf-admin"
    runas: "ALL"
    commands: "ALL"
    nopasswd: false

  - name: INF_WRITE
    ad_group: "INF_WRITE@lab.example.com"
    sudoers_file: "20-ad-inf-write"
    runas: "ALL"
    commands:
      - /usr/bin/systemctl restart apache2
      - /usr/bin/systemctl status apache2
      - /usr/bin/journalctl
    nopasswd: false

  - name: INF_READ
    ad_group: "INF_READ@lab.example.com"
    sudoers_file: "30-ad-inf-read"
    runas: "ALL"
    commands:
      - /usr/bin/systemctl status *
      - /usr/bin/journalctl
      - /usr/bin/less
      - /usr/bin/cat
    nopasswd: true
