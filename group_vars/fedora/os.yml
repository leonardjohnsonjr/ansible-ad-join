---
ad_os_family_name: fedora

ad_required_packages:
  - realmd
  - sssd
  - sssd-tools
  - oddjob
  - oddjob-mkhomedir
  - adcli
  - samba-common-tools
  - krb5-workstation
  - openldap-clients
  - policycoreutils-python-utils

ad_authselect_profile: sssd
ad_authselect_features:
  - with-mkhomedir
  - with-sudo

ad_mkhomedir_method: authselect

ad_sssd_service_name: sssd
ad_oddjobd_service_name: oddjobd
